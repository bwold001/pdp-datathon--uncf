[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdp-student-success"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.146", "uvicorn>=0.54", "pydantic>=2", "pyyaml>=6", "pyarrow>=17"]

[tool.setuptools.packages.find]
include = ["analytics*", "api*", "measures*"]
exclude = ["*.tests*"]

[tool.setuptools.package-data]
analytics = ["config/*.yaml"]
