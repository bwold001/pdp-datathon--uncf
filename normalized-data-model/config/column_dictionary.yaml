- table: cohort_membership
  column: cohort
  dictionary_name: Cohort
  description_source: pdp_cohort_data.csv
  description: 'All undergraduate students who attempted at least one course in a given term, for the
    first time at the cohort institution in YYYY-YY format. **Example:** *2016-17*


    Students may be first-time ever in college or new transfer students at the cohort institution and
    may be enrolled at any program level, including credential- seeking; college remedial, developmental,
    or college- preparatory; adult basic skills (ESL, ABE, or ASE/GED); and non-credit vocational students.
    For non-credit vocational students, cohort only includes those who enrolled in courses that could
    lead to an occupational certificate, industry certificate, or other type of credential of economic
    value, as well as those students who are simultaneously enrolled in credit- bearing courses.'
  dictionary_values: []
  notes: '**Also includes:**


    - Past dual enrollment students who took a course or courses at the cohort institution while simultaneously
    attending high school.

    - Fall entry students who enrolled in summer work prior to first term of enrollment with credential-seeking
    status. Examples of summer work include summer bridge programs or developmental/remedial coursework.


    **Does not include:**


    - Non-credit vocational students enrolled in purely personal enrichment courses.

    - Current dual enrollment students or those taking a course or courses at the cohort institution while
    simultaneously attending high school.'
  sources:
  - source_file: pdp_cohort_data.csv
    source_column: Cohort
    dictionary_file: data/dictionaries/arf_cohort_data_dictionary.md
    lookup_description: All undergraduate students who attempted at least one course in a given term,
      for the first time at the cohort institution in YYYY-YY format. **Example:** *2016-17*
  - source_file: pdp_course_data.csv
    source_column: Cohort
    dictionary_file: data/dictionaries/arf_course_data_dictionary.md
    lookup_description: 'Academic year in which the student first enrolled in at least one course in YYYY-YY
      format. Must match the Cohort value in the course data file. Must be 2 consecutive years between
      2000 and today. Example: 2019-20'
