- table: cohort_membership
  column: years_to_ba_at_cohort_inst
  dictionary_name: Years to Bachelors at Cohort Inst
  description_source: pdp_cohort_data.csv
  description: 'The most recent academic year in which the cohort institution awarded a bachelor’s degree
    to the student (as determined by the student’s reported cohort start date). To calculate a student’s
    time to credential, PDP uses three values: the credential award date from an institution as reported
    to the Clearinghouse’s degree verification service, the student’s reported cohort start date value
    as reported to PDP, and the number of calendar days in a year. The value is calculated as: (credential
    award date – cohort begin date)/365. If the result is >0 and <=1, the value is 1; if the result is
    >1 and <=2, the value is 2, and so forth up to value of 7.'
  dictionary_values:
  - code: '0'
    meaning: null
  - code: '1'
    meaning: null
  - code: '2'
    meaning: null
  - code: '3'
    meaning: null
  - code: '4'
    meaning: null
