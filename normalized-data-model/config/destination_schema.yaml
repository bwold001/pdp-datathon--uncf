      - {pattern: '^(4(\.0+)?|[0-3](\.[0-9]+)?|P|F|I|W|A|O)$', severity: warning}   # warning for now: the mock data breaks it (1 cohort row)
  attempted_dev_math_y1:
    type: str
    nullable: true
