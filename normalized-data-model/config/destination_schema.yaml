  number_of_credits_attempted_yr_2:   # blank in a year the data can't see yet: see credit_years_observed
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_earned_yr_2:   # blank in a year the data can't see yet: see credit_years_observed
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_attempted_yr_3:   # blank in a year the data can't see yet: see credit_years_observed
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_earned_yr_3:   # blank in a year the data can't see yet: see credit_years_observed
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_attempted_yr_4:   # blank in a year the data can't see yet: see credit_years_observed
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_earned_yr_4:   # blank in a year the data can't see yet: see credit_years_observed
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  credit_years_observed:   # how many of the 4 credit years had happened by the cutoff (set in config/data_fixes.yaml), the same for a whole cohort. A blank credit year at or below it is missing; above it, not yet happened. Filled by the future_credit_years_are_blank fix, not by a file
