term:
  term_id: {type: int, nullable: false, primary_key: true}
  academic_year:
    type: str
    nullable: false
    unique: term_key
    default_value: UNKNOWN
    unknown_value: UNKNOWN
    rules:
      - {academic_year: true, severity: error}
  academic_term:
    type: str
    nullable: false
    unique: term_key
    default_value: UNKNOWN
    unknown_value: UNKNOWN
    rules:
      - {value_set: academic_term, ignore_case: true, severity: error}
  sort_order: {type: int, nullable: false}

course:
  course_id: {type: int, nullable: false, primary_key: true}
  course_prefix:
    type: str
    nullable: false
    unique: course_code
    rules:
      - {pattern: '^[A-Za-z0-9._&-]+$', severity: error}
  course_number:
    type: str
    nullable: false
    unique: course_code
    rules:
      - {pattern: '^[A-Za-z0-9._&-]+$', severity: error}

course_enrollment:
  enrollment_id: {type: int, nullable: false, primary_key: true}
  provider_id: {type: int, nullable: false, foreign_key: data_provider.provider_id, unique: source_row}
  source_row_number: {type: int, nullable: false, unique: source_row}
  student_id: {type: str, nullable: false, foreign_key: student.student_id}
  cohort:   # the course file's Cohort: which of the student's cohorts this row belongs to
    type: str
    nullable: false
    rules:
      - {academic_year: true, severity: error}
  course_file_cohort_term:   # the course file's own Cohort_Term, kept apart from cohort_membership.cohort_term (the cohort file's), which it differs from on 4,307 rows, so the two can be compared
    type: str
    nullable: false
    rules:
      - {value_set: academic_term, ignore_case: true, severity: error}
  course_id: {type: int, nullable: true, foreign_key: course.course_id}
  term_id: {type: int, nullable: false, foreign_key: term.term_id}
  attempt_number: {type: int, nullable: true}   # blank on rows with no course record
  section_id:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {pattern: '^[A-Za-z0-9._&-]+$', severity: warning}   # warning for now: the mock data breaks it (68 course rows)
      - {required_when: {column: course.course_prefix, present: true}, severity: error}
  course_name:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {required_when: {column: course.course_prefix, present: true}, severity: error}
  course_cip:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {pattern: '^[0-9]{2}\.[0-9]{4}$', severity: warning}   # warning for now: the mock data breaks it (2,276 course rows, such as 24, 24.01 or 09.01); the zeros that can only be read one way are put back first (config/data_fixes.yaml)
      - {required_when: {column: course.course_prefix, present: true}, severity: error}
  course_type:
    type: str
    nullable: true
    rules:
      - {enum: [CU, CG, CC, CD, EL, AB, GE, NC, O], severity: error}
      - {required_when: {column: course.course_prefix, present: true}, severity: error}
  math_or_english_gateway:
    type: str
    nullable: true
    rules:
      - {enum: [M, E, N], severity: error}   # the mock data's NA is fixed to N (config/data_fixes.yaml)
      - {required_when: {column: course.course_prefix, present: true}, severity: error}
  co_requisite_course:
    type: str
    nullable: true
    rules:
      - {value_set: yes_no, severity: error}
  course_begin_date: {type: date, nullable: true}
  course_end_date:
    type: date
    nullable: true
    rules:
      - {not_before: course_begin_date, severity: error}
  grade:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {pattern: '^(4(\.0+)?|[0-3](\.[0-9]+)?|P|F|I|W|A|O)$', severity: warning}   # warning for now: the mock data breaks it (95 course rows)
  number_of_credits_attempted:
    type: float
    nullable: true
    rules:
      - {minimum: 0, maximum: 20, severity: error}
  number_of_credits_earned:
    type: float
    nullable: true
    rules:
      - {minimum: 0, maximum: 20, severity: error}
      - {not_greater_than: number_of_credits_attempted, severity: error}
  delivery_method:
    type: str
    nullable: true
    rules:
      - {enum: [F, O, H], severity: error}
  core_course:
    type: str
    nullable: true
    rules:
      - {value_set: yes_no, severity: error}
  core_course_type:
    type: str
    nullable: true
    rules:
      - {max_length: 20, severity: error}
      - {required_when: {column: core_course, equals: Y}, severity: error}
  core_competency_completed:
    type: str
    nullable: true
    rules:
      - {value_set: yes_no, severity: error}
  enrolled_at_other_institution_s:
    type: str
    nullable: true
    rules:
      - {value_set: yes_no, severity: error}
  credential_engine_identifier: {type: str, nullable: true}
  course_instructor_employment_sta:
    type: str
    nullable: true
    rules:
      - {enum: [PT, FT], severity: error}
  course_instructor_rank:
    type: str
    nullable: true
    rules:
      - {enum: ['1', '2', '3', '4', '5', '6', '7'], severity: warning}   # warning for now: the mock data breaks it (77,800 course rows)
  s_enrollment_record_at_other:
    type: str
    nullable: true
    list_delimiter: '|'
    rules:
      - {pattern: '^[A-Z]{2}$', severity: error}
  c_enrollment_record_at_other:
    type: str
    nullable: true
    list_delimiter: '|'
    rules:
      - {pattern: '^[A-Za-z][A-Za-z'' &/-]*$', severity: error}
  l_enrollment_record_at_other:
    type: str
    nullable: true
    list_delimiter: '|'
    rules:
      - {value_set: locale, severity: error}
  term_program_of_study:
    type: str
    nullable: true
    rules:
      - {pattern: '^[0-9]{6}$', severity: warning}   # the mock data's lost leading zeros are put back first (config/data_fixes.yaml)
  foreignKeys:   # join to cohort_membership on both columns: 2 students are in two cohorts
    - {fields: [student_id, cohort], reference: {resource: cohort_membership, fields: [student_id, cohort]}}

student_attribute:
  attribute_id: {type: int, nullable: false, primary_key: true}
  student_id: {type: str, nullable: false, foreign_key: student.student_id, unique: attribute_fact}
  term_id: {type: int, nullable: true, foreign_key: term.term_id, unique: attribute_fact}
  attribute_key: {type: str, nullable: false, unique: attribute_fact}
  attribute_value:
    type: str
    nullable: false
    unique: attribute_fact
    rules:
      - {enum: ['true', 'false'], when: {column: attribute_key, equals: uses_on_campus_housing}, severity: error}
  source: {type: str, nullable: false, unique: attribute_fact}

institution_event:
  event_id: {type: int, nullable: false, primary_key: true}
  institution_id: {type: int, nullable: false, foreign_key: institution.institution_id, unique: event_fact}
  event_type:
    type: str
    nullable: false
    unique: event_fact
    rules:
      - {pattern: '^[a-z]+(_[a-z]+)*$', severity: error}   # lower-case words joined by underscores, e.g. community_gathering
      - {value_set: event_type, severity: warning}        # a new type loads, and is reported until it's added to the list
  name: {type: str, nullable: false, unique: event_fact}
  start_date: {type: date, nullable: false, unique: event_fact}
  end_date:
    type: date
    nullable: false
    rules:
      - {not_before: start_date, severity: error}
  source: {type: str, nullable: true}

load_run:   # one row: the run that built this database. No file maps to it; the loader writes it.
  run_id: {type: str, nullable: false, primary_key: true}
  started_at: {type: datetime, nullable: false}    # when the load started (UTC): the same moment as every data_provider.loaded_at
  finished_at: {type: datetime, nullable: false}   # when its rows were written, just before the commit
  backend:   # sqlite or postgres; blank in the samples
    type: str
    nullable: true
    rules:
      - {enum: [sqlite, postgres], severity: error}
  load_report: {type: str, nullable: true}         # paths are on the machine that ran the load, from normalized-data-model/
  validation_reports: {type: str, nullable: true, list_delimiter: '|'}
  staging_folder: {type: str, nullable: true}      # data/staging/<run id>
  file_format:   # csv or parquet: the staging area and the table files
    type: str
    nullable: false
    rules:
      - {enum: [csv, parquet], severity: error}
  credit_cutoff:   # the cutoff the credit-year fix used; blank if that fix was off
    type: str
    nullable: true
    rules:
      - {academic_year: true, severity: error}

