  years_to_a_or_c_at_cohort_inst:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  years_to_ba_at_other_inst:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  years_to_a_or_c_at_other_inst:
