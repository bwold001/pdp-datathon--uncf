- source: S_Enrollment_Record_at_other
  destination_table: course_enrollment
  destination_column: s_enrollment_record_at_other
  on_conflict: replace

- source: C_Enrollment_Record_at_other
  destination_table: course_enrollment
  destination_column: c_enrollment_record_at_other
  on_conflict: replace

- source: L_Enrollment_Record_at_other
  destination_table: course_enrollment
